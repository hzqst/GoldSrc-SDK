<?xml version="1.0" encoding="UTF-8"?>
<!--
  EXPERIMENTAL: direct function-call model only.
  Cppcheck may not match calls through the gEngfuncs.COM_LoadFile function-pointer table.
  COM_LoadFile/COM_FreeFile ownership rules must be checked against the actual API mode.
  Test this library config on a small source fixture before enabling it as a CI gate.
-->
<def>
  <memory>
    <alloc>COM_LoadFile</alloc>
    <dealloc>COM_FreeFile</dealloc>
  </memory>
  <!-- COM_ParseFile takes a borrowed parser cursor; it does not own the input buffer. -->
  <function name="COM_ParseFile">
    <leak-ignore/>
    <arg nr="1"/>
    <arg nr="2"/>
  </function>
</def>
